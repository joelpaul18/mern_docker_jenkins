services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    image: api-server:${BUILD_NUMBER}
    container_name: api-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build: ./client
    image: react-app:${BUILD_NUMBER}
    container_name: react-app
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo-data:
